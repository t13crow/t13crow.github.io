name: Add photography packages and booking terms
on:
  push:
    paths: ['.github/workflows/package-pricing.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add translated pricing cards and terms
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,html,hashlib,subprocess
          COPY=json.loads("{\"en\":{\"title\":\"Session packages\",\"cards\":[[\"Essential\",\"€100\",\"1 hour · 1 location\",\"5 edited photographs\",\"No video\"],[\"Standard\",\"€250\",\"2 hours · up to 2 nearby locations\",\"10 edited photographs\",\"Edited video · about 30 seconds\"],[\"Complete\",\"€500\",\"4 hours · locations by arrangement\",\"20 edited photographs\",\"Edited video · about 1 minute\"]],\"raw\":\"All original photo files are included (unedited).\",\"hour\":\"Hourly session\",\"hourprice\":\"€55 per hour\",\"hourdetail\":\"Photo editing is priced separately. A €15 booking prepayment secures the session and is deducted from the final total.\",\"extra\":\"Travel outside the city and any location entry or rental fees are charged separately, when applicable.\",\"cancel\":\"Cancellation: any advance payment is refunded in full within 14 days. If you need to change the date, the prepayment can be transferred to the new date.\",\"select\":\"Choose this package\"},\"ru\":{\"title\":\"Пакеты съемки\",\"cards\":[[\"Базовый\",\"100 €\",\"1 час · 1 локация\",\"5 фотографий с обработкой\",\"Без видео\"],[\"Стандарт\",\"250 €\",\"2 часа · до 2 близких локаций\",\"10 фотографий с обработкой\",\"Видео с монтажом · около 30 секунд\"],[\"Полный\",\"500 €\",\"4 часа · локации по договоренности\",\"20 фотографий с обработкой\",\"Видео с монтажом · около 1 минуты\"]],\"raw\":\"Все исходные фотографии передаются без обработки.\",\"hour\":\"Почасовая съемка\",\"hourprice\":\"55 € в час\",\"hourdetail\":\"Обработка фотографий оплачивается отдельно. Предоплата 15 € подтверждает запись и вычитается из итоговой суммы.\",\"extra\":\"Поездки за пределы города, входные билеты и аренда локации оплачиваются отдельно, если применимо.\",\"cancel\":\"Отмена: любая предоплата возвращается полностью в течение 14 дней. Если нужно перенести съемку, предоплату можно перенести на новую дату.\",\"select\":\"Выбрать пакет\"},\"tr\":{\"title\":\"Çekim paketleri\",\"cards\":[[\"Temel\",\"100 €\",\"1 saat · 1 lokasyon\",\"Düzenlenmiş 5 fotoğraf\",\"Video yok\"],[\"Standart\",\"250 €\",\"2 saat · yakında en fazla 2 lokasyon\",\"Düzenlenmiş 10 fotoğraf\",\"Düzenlenmiş video · yaklaşık 30 saniye\"],[\"Tam\",\"500 €\",\"4 saat · lokasyonlar görüşülür\",\"Düzenlenmiş 20 fotoğraf\",\"Düzenlenmiş video · yaklaşık 1 dakika\"]],\"raw\":\"Düzenlenmemiş tüm orijinal fotoğraflar teslim edilir.\",\"hour\":\"Saatlik çekim\",\"hourprice\":\"Saat başına 55 €\",\"hourdetail\":\"Fotoğraf düzenleme ücreti ayrıca hesaplanır. 15 € ön ödeme çekim rezervasyonunu kesinleştirir ve son toplamdan düşülür.\",\"extra\":\"Şehir dışı ulaşım, lokasyon giriş ve kiralama ücretleri varsa ayrıca hesaplanır.\",\"cancel\":\"İptal: alınan tüm ön ödemeler 14 gün içinde tamamen iade edilir. Tarih değişikliği gerekirse ön ödeme yeni tarihe aktarılabilir.\",\"select\":\"Bu paketi seç\"}}")
          def el(tag,children,props=None):return ["$",tag,None,{**(props or {}),"children":children}]
          def package_node(lang):
           d=COPY[lang]
           cards=[]
           for name,price,scope,photos,video in d["cards"]:
            cards.append(el("article",[el("p",price,{"className":"package-price"}),el("h3",name),el("ul",[el("li",scope),el("li",photos),el("li",video)]),el("a",d["select"],{"href":"#inquiry","className":"package-link"})],{"className":"package-card"}))
           return el("section",[el("h2",d["title"]),el("div",cards,{"className":"package-grid"}),el("p",d["raw"],{"className":"package-note"}),el("div",[el("h3",d["hour"]),el("p",d["hourprice"]),el("p",d["hourdetail"])],{"className":"hourly-note"}),el("p",d["extra"],{"className":"package-terms"}),el("p",d["cancel"],{"className":"package-terms"})],{"className":"package-section"})
          def mutate(x,lang):
           if isinstance(x,list):
            if len(x)==4 and x[0]=="$" and x[1]=="main" and isinstance(x[3],dict) and x[3].get("className")=="inner-page contact-page":
             children=x[3]["children"]
             if not any(isinstance(y,list) and len(y)==4 and y[1]=="section" and y[3].get("className")=="package-section" for y in children):
              children.insert(1,package_node(lang))
             return
            for y in x:mutate(y,lang)
           elif isinstance(x,dict):
            for y in x.values():mutate(y,lang)
          def change_flight(s,lang):
           out=[]
           for line in s.splitlines(True):
            if ":" not in line:out.append(line);continue
            k,v=line.split(":",1)
            try:o=json.loads(v)
            except:out.append(line);continue
            mutate(o,lang);out.append(k+":"+json.dumps(o,ensure_ascii=False,separators=(",",":"))+("\n" if line.endswith("\n") else ""))
           return "".join(out)
          def render(n):
           if isinstance(n,str):return html.escape(n)
           tag,p,c=n[1],n[3],n[3]["children"]
           attrs=""
           for k,v in p.items():
            if k=="children":continue
            key="class" if k=="className" else k
            attrs+=" "+key+"="+html.escape(str(v),quote=True)
           return "<"+tag+attrs+">"+("".join(render(a) for a in c) if isinstance(c,list) else render(c))+"</"+tag+">"
          for lang in COPY:
           for p in Path(lang+"/contact").glob("*.txt"):
            p.write_text(change_flight(p.read_text(),lang))
           p=Path(lang+"/contact/index.html");s=p.read_text()
           marker='<header class="contact-heading">'
           start=s.index(marker);end=s.index("</header>",start)+len("</header>")
           s=s[:end]+render(package_node(lang))+'<form id="inquiry"'+s[s.index('<form ',end)+6:]
           p.write_text(s)
          css=Path("_next/static/css/540dfd1690fe1aab.css")
          s=css.read_text()+"""
          .package-section{margin:3rem 0 4rem}.package-section>h2{font-size:clamp(1.8rem,4vw,3rem);margin:0 0 1.5rem}.package-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}.package-card{border:1px solid rgba(255,255,255,.18);padding:1.4rem;display:flex;flex-direction:column;min-height:19rem;background:rgba(255,255,255,.025)}.package-card h3{font-size:1.4rem;margin:.35rem 0 1rem}.package-price{font-size:2rem;margin:0}.package-card ul{list-style:none;padding:0;margin:0 0 1.5rem;display:grid;gap:.75rem}.package-link{margin-top:auto;display:inline-flex;width:max-content;border-bottom:1px solid currentColor;padding:.4rem 0;text-decoration:none}.package-note,.package-terms{line-height:1.65;max-width:72ch;opacity:.8}.hourly-note{border-top:1px solid rgba(255,255,255,.18);border-bottom:1px solid rgba(255,255,255,.18);padding:1.3rem 0;margin-top:1.5rem}.hourly-note h3{margin:0 0 .5rem}.hourly-note p{margin:.35rem 0;line-height:1.6}.package-terms{margin:.8rem 0}@media(max-width:700px){.package-grid{grid-template-columns:1fr}.package-card{min-height:0}}
          """
          css.write_text(s)
          versions={}
          for p in [css]:
           new=re.sub(r'[a-f0-9]{16}(?=\.css$)',hashlib.sha256(p.read_bytes()).hexdigest()[:16],p.name)
           p.with_name(new).write_bytes(p.read_bytes());versions[p.name]=new
          for p in Path(".").rglob("*"):
           if not p.is_file() or ".git" in p.parts or ".github" in p.parts or p.suffix not in (".html",".txt"):continue
           s=p.read_text()
           for a,b in versions.items():s=s.replace(a,b)
           p.write_text(s)
          for lang in COPY:
           s=Path(lang+"/contact/index.html").read_text()
           assert s.count('class="package-section"')==1 and 'id="inquiry"' in s
           assert s.count('€')>=4
           assert "refunded in full within 14 days" in s if lang=="en" else ("возвращается полностью в течение 14 дней" in s if lang=="ru" else "14 gün içinde tamamen iade edilir" in s)
           assert Path(lang+"/contact/index.txt").read_text().count('"className":"package-section"')>=1
          print("Pricing and booking terms rendered in EN/RU/TR.")
          
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add photography package pricing and booking policy"
          git push origin HEAD:main
