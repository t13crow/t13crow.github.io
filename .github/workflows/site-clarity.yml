name: Improve booking clarity and English default
on:
  push:
    paths: ['.github/workflows/site-clarity.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update and validate static export
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,html,hashlib,subprocess
          replacements=json.loads("{\"Let’s create\":\"Book a shoot\",\"It all begins\":\"Plan your\",\"with a feeling.\":\"photo session.\",\"Tell me what you have in mind. We’ll find the rest together.\":\"Choose your city and type of shoot. Add a preferred date if you have one.\",\"Or simply say hello\":\"Prefer a direct conversation? Message me on Instagram\",\"Another way to reach you\":\"Include your country code\",\"Send your story\":\"Send inquiry\",\"Your story is on its way.\":\"Your inquiry has been sent.\",\"Your inquiry has been sent to the photographer. You will be contacted using the details you provided.\":\"Your inquiry has reached the photographer. This is not a confirmed booking; the date and details still need to be agreed.\",\"For ideas, collaborations and moments that matter.\":\"An inquiry does not reserve a date. Pricing, session length, edited photo count and delivery timing depend on your project.\",\"Start a story\":\"Book a photo session\",\"A personal shoot, fashion, a wedding or an idea that doesn’t have a name yet. Let’s start with a conversation.\":\"Portraits for individuals, fashion imagery for creative projects, lifestyle sessions and wedding photography. Choose a direction and city, then send an inquiry to discuss your shoot.\",\"Обсудим съемку\":\"Запись на съемку\",\"Все начинается\":\"Спланируем\",\"с чувства.\":\"вашу съемку.\",\"Расскажите о вашей идее. Остальное найдем вместе.\":\"Выберите город и тип съемки. Если дата уже известна, укажите ее.\",\"Или просто напишите\":\"Предпочитаете личное общение? Напишите мне в Instagram\",\"Как еще с вами связаться\":\"Укажите код страны\",\"Отправить историю\":\"Отправить заявку\",\"Ваша история уже в пути.\":\"Ваша заявка отправлена.\",\"Заявка отправлена фотографу. С вами свяжутся по указанным контактным данным.\":\"Заявка получена фотографом. Это еще не подтвержденная запись: дату и детали нужно согласовать.\",\"Для идей, коллабораций и ваших важных моментов.\":\"Заявка не резервирует дату. Стоимость, длительность, количество обработанных фотографий и срок готовности зависят от проекта.\",\"Начать историю\":\"Записаться на съемку\",\"Личная съемка, fashion, свадьба или идея, у которой пока нет названия. Начнем с разговора.\":\"Индивидуальные портреты, модные съемки для творческих проектов, lifestyle и свадебная фотография. Выберите направление и город, затем отправьте заявку для обсуждения деталей.\",\"Birlikte yaratalım\":\"Çekim planla\",\"Her şey bir\":\"Fotoğraf çekiminizi\",\"hisle başlar.\":\"planlayalım.\",\"Aklınızdaki fikri anlatın. Gerisini birlikte buluruz.\":\"Şehri ve çekim türünü seçin. Aklınızda bir tarih varsa ekleyin.\",\"Ya da bir merhaba deyin\":\"Doğrudan konuşmak ister misiniz? Instagram üzerinden yazın\",\"Size ulaşmanın başka bir yolu\":\"Ülke kodunu ekleyin\",\"Hikâyenizi gönderin\":\"Talep gönder\",\"Hikâyeniz yola çıktı.\":\"Talebiniz gönderildi.\",\"Talebiniz fotoğrafçıya gönderildi. Verdiğiniz iletişim bilgileri üzerinden sizinle iletişime geçilecek.\":\"Talebiniz fotoğrafçıya ulaştı. Bu, kesinleşmiş bir rezervasyon değildir; tarih ve ayrıntılar henüz kararlaştırılmalıdır.\",\"Fikirler, iş birlikleri ve sizin için önemli anlar.\":\"Talep göndermek tarihi ayırmaz. Fiyat, çekim süresi, düzenlenmiş fotoğraf sayısı ve teslim zamanı projenize bağlıdır.\",\"Bir hikâye başlatın\":\"Fotoğraf çekimi planla\",\"Kişisel çekim, moda, düğün ya da henüz adı olmayan bir fikir. Bir sohbetle başlayalım.\":\"Bireysel portreler, yaratıcı projeler için moda fotoğrafları, yaşam tarzı ve düğün çekimleri. Çekiminizi görüşmek için alanı ve şehri seçip talep gönderin.\"}")
          steps=json.loads("{\"en\":[\"How it works\",\"1. Send an inquiry\",\"Choose a shoot type and city, and share a date or idea if you have one.\",\"2. Discuss the details\",\"Discuss availability, location, price, session length, edited photo count and delivery timing.\",\"3. Confirm your session\",\"Agree the final details with the photographer before treating the date as booked.\"],\"ru\":[\"Как это работает\",\"1. Отправьте заявку\",\"Выберите тип съемки и город. При желании добавьте дату и идею.\",\"2. Обсудите детали\",\"Обсудите свободные даты, место, стоимость, длительность, количество обработанных фотографий и срок готовности.\",\"3. Подтвердите съемку\",\"Согласуйте окончательные детали с фотографом, прежде чем считать дату забронированной.\"],\"tr\":[\"Nasıl ilerler?\",\"1. Talep gönderin\",\"Çekim türünü ve şehri seçin. Dilerseniz tarih ve fikrinizi ekleyin.\",\"2. Ayrıntıları görüşün\",\"Uygun tarih, konum, fiyat, çekim süresi, düzenlenmiş fotoğraf sayısı ve teslim zamanını görüşün.\",\"3. Çekimi kesinleştirin\",\"Tarihi ayrılmış kabul etmeden önce son ayrıntıları fotoğrafçıyla kararlaştırın.\"]}")
          def node(tag,children,**props):
              return ["$",tag,None,{**props,"children":children}]
          def section(lang):
              a=steps[lang]
              return node("section",[node("h2",a[0]),node("ol",[node("li",[node("h3",a[i]),node("p",a[i+1])]) for i in (1,3,5)])],className="booking-steps")
          def mutate(obj,lang):
              if isinstance(obj,list):
                  if len(obj)==4 and obj[0]=="$" and obj[1]=="header" and isinstance(obj[3],dict) and obj[3].get("className")=="contact-heading":
                      obj[3]["children"].append(section(lang))
                      return
                  for v in obj:mutate(v,lang)
              elif isinstance(obj,dict):
                  for v in obj.values():mutate(v,lang)
          def flight(text,lang):
              result=[]
              for line in text.splitlines(True):
                  if ":" not in line:result.append(line);continue
                  key,value=line.split(":",1)
                  try:obj=json.loads(value)
                  except (ValueError,TypeError):result.append(line);continue
                  mutate(obj,lang)
                  result.append(key+":"+json.dumps(obj,ensure_ascii=False,separators=(",",":"))+("\n" if line.endswith("\n") else ""))
              return "".join(result)
          def render(n):
              if isinstance(n,str):return html.escape(n)
              tag,props=n[1],n[3]
              attrs=' class="'+props["className"]+'"' if "className" in props else ""
              c=props["children"]
              return "<"+tag+attrs+">"+("".join(map(render,c)) if isinstance(c,list) else render(c))+"</"+tag+">"
          changed=[]
          for p in Path(".").rglob("*"):
              if not p.is_file() or ".git" in p.parts or ".github" in p.parts or "integrations" in p.parts or p.suffix not in (".html",".txt",".js",".xml"):continue
              s=p.read_text();old=s
              for a,b in replacements.items():
                  s=s.replace(a,b).replace(html.escape(a,quote=False),html.escape(b,quote=False))
              s=s.replace('defaultLocale:"ru"','defaultLocale:"en"')
              # HTML, plain flight data, and escaped flight data use different encodings.
              for quote in ['"',r'\"']:
                  s=s.replace('hrefLang'+quote+':'+quote+'x-default'+quote+','+quote+'href'+quote+':'+quote+'https://t13crow.github.io/ru/',
                              'hrefLang'+quote+':'+quote+'x-default'+quote+','+quote+'href'+quote+':'+quote+'https://t13crow.github.io/en/')
              s=re.sub(r'(hreflang="x-default" href="https://t13crow.github.io/)ru/',r'\1en/',s,flags=re.I)
              lang=p.parts[0]
              if lang in steps and "contact" in p.parts:
                  if p.suffix==".txt":s=flight(s,lang)
                  elif p.suffix==".html":
                      assert 'class="contact-heading"' in s
                      s=s.replace("</header>",render(section(lang))+"</header>",1) if s.find('class="contact-heading"')<s.find("</header>") else s
                      # Find the contact header specifically, not the site navigation header.
                      if 'class="booking-steps"' not in s:
                          start=s.index('class="contact-heading"');end=s.index("</header>",start)
                          s=s[:end]+render(section(lang))+s[end:]
                      def embedded(m):
                          payload=json.loads(m[1])
                          payload[1]=flight(payload[1],lang)
                          return "self.__next_f.push("+json.dumps(payload,ensure_ascii=False,separators=(",",":"))+")"
                      s=re.sub(r'self\.__next_f\.push\((\[1,"(?:[^"\\]|\\.)*"\])\)',embedded,s)
              if s!=old:p.write_text(s);changed.append(str(p))
          root=Path("index.html")
          root.write_text('<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=/en/"><link rel="canonical" href="https://t13crow.github.io/en/"><title>ФАНТАЗЁР — Photography</title></head><body style="background:#090909;color:#f0f0f0"><a href="/en/">Open photography portfolio</a><script>location.replace("/en/"+location.search+location.hash)</script></body></html>')
          # Version modified CSS and JS assets so browsers request fresh content.
          css=Path("_next/static/css/d04b07fdc3399457.css")
          css.write_text(css.read_text()+"\n.booking-steps{margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid #ffffff26}.booking-steps h2{font-size:1.2rem;line-height:1.4;margin:0 0 1.25rem}.booking-steps ol{list-style:none;padding:0;margin:0;display:grid;gap:1.25rem}.booking-steps h3{font-size:.95rem;line-height:1.5;margin:0 0 .35rem}.booking-steps p{font-size:.9rem;line-height:1.65;margin:0;max-width:46ch}\n")
          versions={}
          for p in [css]+[Path(s) for s in changed if s.endswith(".js")]:
              subprocess.run(["node","--check",str(p)],check=True) if p.suffix==".js" else None
              old=p.name
              name=re.sub(r'[a-f0-9]{16}(?=\.(js|css)$)',hashlib.sha256(p.read_bytes()).hexdigest()[:16],old)
              if name==old:continue
              p.with_name(name).write_bytes(p.read_bytes());versions[old]=name
          for p in Path(".").rglob("*"):
              if not p.is_file() or ".git" in p.parts or ".github" in p.parts or "integrations" in p.parts or p.suffix not in (".html",".txt",".js"):continue
              s=p.read_text()
              for old,new in versions.items():s=s.replace(old,new)
              p.write_text(s)
          for lang in steps:
              s=Path(lang+"/contact/index.html").read_text()
              assert s.count('class="booking-steps"')==1
              for field in ("email","phone"):
                  assert 'required=""' in re.search(r'<input id="'+field+r'"[^>]*>',s)[0]
              assert "required" not in re.search(r'<textarea[^>]*>',s)[0]
              assert "0x4AAAAAAFz7zCM1Xvmg_kB6" in s
              for p in Path(lang+"/contact").glob("*.txt"):
                  assert steps[lang][0] in p.read_text() or "contact-heading" not in p.read_text()
          assert 'url=/en/' in root.read_text()
          diff=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
          assert not any(p.startswith(("images/","photos/","integrations/")) or p.endswith((".jpg",".jpeg",".png",".webp")) for p in diff)
          print("Verified English default, multilingual booking steps, required fields, and unchanged photos/integration.")
          print("Changed files:",len(diff))
          
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Default to English and clarify photography inquiries in all languages"
          git push origin HEAD:main
