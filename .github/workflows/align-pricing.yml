name: Align all session pricing
on:
  push:
    paths: ['.github/workflows/align-pricing.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,html,hashlib
          def node(t,c,**p):return ["$",t,None,{**p,"children":c}]
          def isnode(x):return isinstance(x,list) and len(x)==4 and x[0]=="$" and isinstance(x[3],dict)
          copy={
          "en":["Hourly","€55","per hour","Editing charged separately","€15 booking prepayment","Deducted from your final total","Request a session"],
          "ru":["Почасовая","55 €","за час","Обработка отдельно","Предоплата 15 €","Вычитается из итоговой суммы","Оставить заявку"],
          "tr":["Saatlik","55 €","saat başına","Düzenleme ayrıca ücretlendirilir","15 € rezervasyon ön ödemesi","Son toplamdan düşülür","Çekim talep et"]}
          def transform(x,lang):
           if isnode(x) and x[3].get("className")=="package-section":
            cs=x[3]["children"];grid=next(c for c in cs if isnode(c) and c[3].get("className")=="package-grid")
            for card in grid[3]["children"]:
             cc=card[3]["children"]
             price=next(c for c in cc if isnode(c) and c[3].get("className")=="package-price")
             title=next(c for c in cc if isnode(c) and c[1]=="h3")
             rest=[c for c in cc if c is not price and c is not title]
             card[3]["children"]=[title,price]+rest
            d=copy[lang]
            grid[3]["children"].append(node("article",[node("h3",d[0]),node("p",d[1],className="package-price"),node("ul",[node("li",d[2]),node("li",d[3]),node("li",d[4])]),node("a",d[6],href="#inquiry",className="package-link")],className="package-card hourly-card"))
            x[3]["children"]=[c for c in cs if not(isnode(c) and c[3].get("className")=="hourly-note")]
            details=next(c for c in x[3]["children"] if isnode(c) and c[1]=="details")
            details[3]["children"].insert(1,node("p",d[4]+". "+d[5]+".",className="package-terms"))
            return
           if isinstance(x,list):
            for c in x:transform(c,lang)
           elif isinstance(x,dict):
            for c in x.values():transform(c,lang)
          def flight(text,lang):
           out=[]
           for line in text.splitlines(True):
            try:k,v=line.split(":",1);o=json.loads(v)
            except (ValueError,IndexError):out.append(line);continue
            transform(o,lang);out.append(k+":"+json.dumps(o,ensure_ascii=False,separators=(",",":"))+("\n" if line.endswith("\n") else ""))
           return "".join(out)
          def render(x):
           if isinstance(x,str):return html.escape(x)
           t,p=x[1],x[3];attrs=""
           for k,v in p.items():
            if k=="children":continue
            attrs+=' '+("class" if k=="className" else k)+'="'+html.escape(str(v),quote=True)+'"'
           c=p["children"]
           return "<"+t+attrs+">"+("".join(render(a) for a in c) if isinstance(c,list) else render(c))+"</"+t+">"
          for lang in copy:
           folder=Path(lang+"/contact")
           for f in folder.glob("*.txt"):f.write_text(flight(f.read_text(),lang))
           sections=[]
           def collect(x):
            if isnode(x) and x[3].get("className")=="package-section":sections.append(x);return
            if isinstance(x,list):
             for y in x:collect(y)
            elif isinstance(x,dict):
             for y in x.values():collect(y)
           for line in (folder/"index.txt").read_text().splitlines():
            try:collect(json.loads(line.split(":",1)[1]))
            except (ValueError,IndexError):pass
           assert len(sections)==1
           f=folder/"index.html";s=f.read_text();a=s.index('<section class="package-section">');b=s.index("</section>",a)+10
           s=s[:a]+render(sections[0])+s[b:]
           def embed(m):
            p=json.loads(m[1]);p[1]=flight(p[1],lang)
            return "self.__next_f.push("+json.dumps(p,ensure_ascii=False,separators=(",",":"))+")"
           s=re.sub(r'self\.__next_f\.push\((\[1,"(?:[^"\\]|\\.)*"\])\)',embed,s)
           f.write_text(s)
           assert s.count('class="package-card"')==3 and s.count('class="package-card hourly-card"')==1
          p=Path(re.search(r'href="(/_next/static/css/[^"]+)"',Path("en/contact/index.html").read_text())[1][1:])
          s=p.read_text()+"""
          /* Unified session comparison */
          .contact-page .package-section{margin:28px 0}
          .contact-page .package-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line)}
          .contact-page .package-card{display:grid;grid-template-rows:28px 48px 1fr 36px;align-content:start;gap:12px;border:0;border-right:1px solid var(--line);padding:22px 18px;min-height:310px;background:transparent;min-width:0}
          .contact-page .package-card:last-child{border:0}
          .contact-page .package-card h3{margin:0;font-size:14px;font-weight:400;line-height:1.5;align-self:start;color:#bbb}
          .contact-page .package-card .package-price{margin:0;font-size:32px;line-height:1.2;color:#eee;white-space:nowrap}
          .contact-page .package-card ul{display:grid;grid-template-rows:repeat(3,minmax(42px,auto));align-content:start;gap:6px;margin:0;padding:0;font-size:12px;line-height:1.6}
          .contact-page .package-card li{margin:0;padding:0;list-style:none}
          .contact-page .package-card .package-link{align-self:end;justify-self:start;margin:0;font-size:11px;line-height:1.5;border-bottom:1px solid #777;padding:4px 0}
          .contact-page .package-note{margin:12px 0;font-size:11px;line-height:1.7}
          .contact-page .booking-details{margin-top:14px}
          .contact-page #inquiry{margin-top:34px}
          @media(max-width:1000px){.contact-page .package-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.contact-page .package-card{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.contact-page .package-card:nth-child(2){border-right:0}.contact-page .package-card:nth-child(3){border-bottom:0}}
          @media(max-width:520px){.contact-page .package-grid{grid-template-columns:1fr}.contact-page .package-card{grid-template-columns:1fr auto;grid-template-rows:auto auto auto;gap:10px 16px;padding:18px;min-height:0;border-right:0;border-bottom:1px solid var(--line)}.contact-page .package-card:nth-child(3){border-bottom:1px solid var(--line)}.contact-page .package-card h3{grid-column:1;grid-row:1;align-self:center}.contact-page .package-card .package-price{grid-column:2;grid-row:1;font-size:26px}.contact-page .package-card ul{grid-column:1/-1;grid-template-rows:none;gap:4px;font-size:12px}.contact-page .package-card .package-link{grid-column:1/-1}.contact-page .package-card:last-child{border:0}}
          """
          p.write_text(s);new=hashlib.sha256(s.encode()).hexdigest()[:16]+".css";p.with_name(new).write_text(s)
          for f in Path(".").rglob("*"):
           if f.is_file() and ".git" not in f.parts and ".github" not in f.parts and f.suffix in (".html",".txt",".js"):
            t=f.read_text();u=t.replace(p.name,new)
            if t!=u:f.write_text(u)
          
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Group hourly rate with packages and align pricing rows"
          git push origin HEAD:main
