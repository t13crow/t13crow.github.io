name: Fix booking page scrolling
on:
  push:
    paths: ['.github/workflows/fix-scroll.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib
          for lang in ("en","ru","tr"):
           p=Path(lang+"/contact/index.html")
           s=p.read_text()
           source=Path(lang+"/contact/index.txt").read_text()
           package=None
           def find(x):
            global package
            if isinstance(x,list):
             if len(x)==4 and x[0]=="$" and x[1]=="section" and isinstance(x[3],dict) and x[3].get("className")=="package-section":package=x
             for y in x:find(y)
            elif isinstance(x,dict):
             for y in x.values():find(y)
           for line in source.splitlines():
            try:find(json.loads(line.split(":",1)[1]))
            except (ValueError,IndexError):pass
           assert package
           def fix(x):
            if isinstance(x,list):
             if len(x)==4 and x[0]=="$" and x[1]=="main" and isinstance(x[3],dict) and x[3].get("className")=="inner-page contact-page":
              children=x[3]["children"]
              if not any(isinstance(y,list) and len(y)==4 and isinstance(y[3],dict) and y[3].get("className")=="package-section" for y in children):children.insert(1,package)
             for y in x:fix(y)
            elif isinstance(x,dict):
             for y in x.values():fix(y)
           def flight(text):
            lines=[]
            for line in text.splitlines(True):
             try:
              k,v=line.split(":",1);obj=json.loads(v)
             except (ValueError,IndexError):
              lines.append(line);continue
             fix(obj)
             lines.append(k+":"+json.dumps(obj,ensure_ascii=False,separators=(",",":"))+("\n" if line.endswith("\n") else ""))
            return "".join(lines)
           def embed(m):
            payload=json.loads(m[1]);payload[1]=flight(payload[1])
            return "self.__next_f.push("+json.dumps(payload,ensure_ascii=False,separators=(",",":"))+")"
           s=re.sub(r'self\.__next_f\.push\((\[1,"(?:[^"\\]|\\.)*"\])\)',embed,s)
           # Use a stable wrapper for the form anchor, matching the flight tree.
           s=s.replace('<form id="inquiry" class="contact-form"','<form class="contact-form"')
           s=s.replace('<form class="contact-form"','<div id="inquiry"><form class="contact-form"',1).replace('</form>','</form></div>',1)
           def wrap(x):
            if isinstance(x,list):
             if len(x)==4 and x[0]=="$" and x[1]=="main" and isinstance(x[3],dict) and x[3].get("className")=="inner-page contact-page":
              c=x[3]["children"];c[-1]=["$","div",None,{"id":"inquiry","children":c[-1]}]
              return
             for y in x:wrap(y)
            elif isinstance(x,dict):
             for y in x.values():wrap(y)
           def wrapflight(text):
            out=[]
            for line in text.splitlines(True):
             try:k,v=line.split(":",1);o=json.loads(v)
             except (ValueError,IndexError):out.append(line);continue
             wrap(o);out.append(k+":"+json.dumps(o,ensure_ascii=False,separators=(",",":"))+("\n" if line.endswith("\n") else ""))
            return "".join(out)
           def wrapembed(m):
            a=json.loads(m[1]);a[1]=wrapflight(a[1]);return "self.__next_f.push("+json.dumps(a,ensure_ascii=False,separators=(",",":"))+")"
           s=re.sub(r'self\.__next_f\.push\((\[1,"(?:[^"\\]|\\.)*"\])\)',wrapembed,s)
           p.write_text(s)
           for f in Path(lang+"/contact").glob("*.txt"):f.write_text(wrapflight(f.read_text()))
          csspath=re.search(r'href="(/_next/static/css/[^"]+)"',Path("en/contact/index.html").read_text())[1][1:]
          p=Path(csspath);s=p.read_text()
          s+="""
          .contact-page{display:block!important}
          .contact-page .contact-heading{position:static!important;top:auto;max-width:800px;margin-bottom:3rem}
          .contact-page .contact-heading>p:not(.eyebrow){max-width:600px}
          .contact-page .package-section{width:100%;min-width:0;margin:3rem 0}
          .contact-page .package-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
          .contact-page .package-card{min-width:0;overflow-wrap:anywhere}
          .contact-page .package-link{max-width:100%;width:fit-content}
          .contact-page #inquiry{max-width:760px;scroll-margin-top:110px;margin-top:3rem}
          @media(max-width:900px){.contact-page .package-grid{grid-template-columns:1fr}}
          """
          p.write_text(s);new=hashlib.sha256(s.encode()).hexdigest()[:16]+".css";p.with_name(new).write_text(s)
          for f in Path(".").rglob("*"):
           if f.is_file() and ".git" not in f.parts and ".github" not in f.parts and f.suffix in (".html",".txt",".js"):
            t=f.read_text();u=t.replace(p.name,new)
            if t!=u:f.write_text(u)
          print("Corrected scrolling layout and synchronized hydration.")
          
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Fix overlapping booking layout and hydration"
          git push origin HEAD:main
