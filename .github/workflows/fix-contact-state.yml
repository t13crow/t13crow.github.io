name: Fix contact form navigation state
on:
  push:
    paths: ['.github/workflows/fix-contact-state.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib,json,subprocess
          key="0x4AAAAAAFz7zCM1Xvmg_kB6"
          count=0
          for lang in ("en","ru","tr"):
           for p in Path(lang+"/contact").glob("*.txt"):
            s=p.read_text();old=s
            s=s.replace('"siteKey":"$undefined","ready":false','"siteKey":"'+key+'","ready":true')
            s=s.replace('{"ready":false}','{"siteKey":"'+key+'","ready":true}')
            if s!=old:p.write_text(s);count+=1
            assert '"ready":false' not in s,str(p)
          versions={}
          for p in Path("_next/static/chunks/app/[locale]/contact").glob("*.js"):
           s=p.read_text()
           before='function f({siteKey:e,ready:t}){'
           if before not in s:continue
           s=s.replace(before,before+'e=e||"'+key+'";t=!0;')
           p.write_text(s)
           subprocess.run(["node","--check",str(p)],check=True)
           new="page-"+hashlib.sha256(s.encode()).hexdigest()[:16]+".js"
           p.with_name(new).write_text(s);versions[p.name]=new
          assert versions
          for p in Path(".").rglob("*"):
           if not p.is_file() or ".git" in p.parts or ".github" in p.parts or p.suffix not in (".html",".txt",".js"):continue
           s=p.read_text();old=s
           for a,b in versions.items():s=s.replace(a,b)
           if s!=old:p.write_text(s)
          for lang in ("en","ru","tr"):
           files=list(Path(lang+"/contact").glob("*__PAGE__.txt"))
           assert files
           for p in files:
            s=p.read_text();assert '"ready":true' in s and key in s,p
          print("Fixed",count,"stale route payloads. All locale navigation payloads have enabled form and verification key.")
          
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Enable inquiry form in prefetched routes and cached navigation"
          git push origin HEAD:main
