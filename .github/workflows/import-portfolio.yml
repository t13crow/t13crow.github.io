name: Import photography portfolio
on:
  push:
    paths: ['.github/workflows/import-portfolio.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace incorrect site with the verified photography portfolio
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 https://github.com/maxandmum/maxandmum.github.io.git 055a5812247859bca3416f3e8bb58b22d2c51aef
          git rm -r -- . ':!.github/workflows/import-portfolio.yml'
          git archive FETCH_HEAD | tar -x
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.').rglob('*'):
              if p.is_file() and '.git' not in p.parts and p.suffix in {'.html', '.txt', '.xml', '.js', '.json', '.md', '.css'}:
                  s = p.read_text()
                  updated = s.replace('maxandmum.github.io', 't13crow.github.io')
                  if updated != s:
                      p.write_text(updated)
          assert Path('.nojekyll').exists()
          assert len(list(Path('images').glob('*.webp'))) == 27
          for lang in ('ru', 'en', 'tr'):
              for route in ('', 'artist', 'works', 'stories', 'contact', 'privacy'):
                  assert (Path(lang) / route / 'index.html').exists()
          assert 'Amir Arsalan Najafi' in Path('README.md').read_text()
          print('Verified photography portfolio: 27 photos, 3 languages, main routes.')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Replace incorrect blog with original photography portfolio"
          git push origin HEAD:main
